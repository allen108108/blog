---
layout: default
---

<article class="post">
    <header class="post-header">
        <h1>{{ page.title }}</h1>
        <p class="post-meta">
            <time datetime="{{ page.date | date_to_xmlschema }}">
                {{ page.date | date: "%Y-%m-%d" }}
            </time>
            {% if page.categories %}
            · 分類: {{ page.categories | join: ", " }}
            {% endif %}
            {% if page.tags %}
            · 標籤: {{ page.tags | join: ", " }}
            {% endif %}
        </p>
    </header>
    
    <div class="post-content">
        {{ content }}
    </div>
</article>
