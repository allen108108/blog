---
layout: default
---

<div class="home">
    <h2>最新文章 (2026+)</h2>
    
    <ul class="post-list">
        {% for post in site.posts %}
        <li>
            <span class="post-date">{{ post.date | date: "%Y-%m-%d" }}</span>
            <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
        </li>
        {% endfor %}
    </ul>
    
    <hr style="margin: 40px 0;">
    
    <h2>歷史文章</h2>
    <p><a href="/blog/archives/">查看 2019-2023 年的所有文章 →</a></p>
</div>
